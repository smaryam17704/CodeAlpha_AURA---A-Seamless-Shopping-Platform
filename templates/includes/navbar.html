{% load static %}
<header class="site-header">
  <div class="container navbar">
    <a href="{% url 'core:home' %}" class="brand" aria-label="AURA home">
      <img src="{% static 'images/aura-logo-transparent.png' %}" alt="AURA">
      <span class="brand-word">AURA</span>
    </a>

    <nav aria-label="Primary">
      <ul class="nav-links">
        <li><a href="{% url 'store:shop' %}" class="{% if request.resolver_match.url_name == 'shop' %}is-active{% endif %}">Shop</a></li>
        <li><a href="{% url 'store:shop' %}?collection=new">New Arrivals</a></li>
        <li><a href="{% url 'store:shop' %}?collection=featured">Collections</a></li>
        <li><a href="{% url 'core:journal' %}">Journal</a></li>
      </ul>
    </nav>

    <div class="nav-actions">
      <button type="button" class="btn-icon" data-search-open aria-label="Search products">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>

      <button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-checked="false" aria-label="Switch to dark theme">
        <span class="knob">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
        </span>
      </button>

      <a href="{% if request.user.is_authenticated %}{% url 'wishlist:wishlist_detail' %}{% else %}{% url 'accounts:login' %}?next={% url 'wishlist:wishlist_detail' %}{% endif %}" class="btn-icon nav-icon-wrap" aria-label="Wishlist">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        {% if wishlist_count > 0 %}<span class="nav-badge" data-wishlist-count>{{ wishlist_count }}</span>{% endif %}
      </a>

      <a href="{% if request.user.is_authenticated %}{% url 'accounts:account_dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}" class="btn-icon" aria-label="Account">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>

      {% if request.user.is_authenticated %}
      <a href="{% url 'notifications:notification_list' %}" class="btn-icon nav-icon-wrap" aria-label="Notifications, {{ unread_notification_count }} unread">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        {% if unread_notification_count > 0 %}<span class="notif-dot"></span>{% endif %}
      </a>
      {% endif %}

      <a href="{% url 'cart:cart_detail' %}" class="btn-icon nav-icon-wrap" aria-label="Cart">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        {% if cart_item_count > 0 %}<span class="nav-badge" data-cart-count>{{ cart_item_count }}</span>{% endif %}
      </a>

      <button type="button" class="nav-toggle" data-drawer-open aria-label="Open menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>
